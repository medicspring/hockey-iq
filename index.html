<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hockey IQ Hub</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0,#264a66,#0f1b26 70%);color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
main{width:100%;max-width:560px;text-align:center}
svg.art{display:block;margin:0 auto 14px;height:min(24dvh,150px);width:auto;max-width:100%}
h1{font-size:clamp(38px,10vw,64px);line-height:1.05;margin:0 0 6px;letter-spacing:.01em}
h1 span{color:#ff5a4f}
.tag{margin:0 0 26px;color:#c3d3df;font-size:clamp(15px,4vw,18px)}
.links{display:flex;flex-direction:column;gap:14px;align-items:center}
a.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,360px);min-height:68px;border-radius:14px;text-decoration:none;font-weight:800;font-size:clamp(20px,5.5vw,24px);border:3px solid #fff}
a.btn svg{width:34px;height:34px;flex:none}
a.go{background:#d7332f;color:#fff}a.adm{background:#fff;color:#0f1b26}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px #0008;outline:3px solid #ffd24a;outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.btn:hover{transform:none}svg animateMotion{display:none}}
</style></head><body><main>
<svg class="art" viewBox="0 0 340 170" role="img" aria-label="Hockey rink with F1 passing to F2" xmlns="http://www.w3.org/2000/svg">
<rect x="4" y="4" width="332" height="162" rx="40" fill="#eef6f9" stroke="#0b141c" stroke-width="4"/>
<line x1="170" y1="4" x2="170" y2="166" stroke="#c33" stroke-width="4"/><line x1="112" y1="4" x2="112" y2="166" stroke="#2f5fc4" stroke-width="4"/><line x1="228" y1="4" x2="228" y2="166" stroke="#2f5fc4" stroke-width="4"/>
<circle cx="170" cy="85" r="26" fill="none" stroke="#2f5fc4" stroke-width="2"/>
<path id="p" d="M140 120 Q190 50 250 66" fill="none" stroke="#c33" stroke-width="3" stroke-dasharray="7 5"/>
<g font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle"><circle cx="140" cy="120" r="13" fill="#f2a900" stroke="#fff" stroke-width="2"/><text x="140" y="125" fill="#14212c">F1</text><circle cx="250" cy="66" r="13" fill="#f2a900" stroke="#fff" stroke-width="2"/><text x="250" y="71" fill="#14212c">F2</text></g>
<ellipse rx="6" ry="4" fill="#111" stroke="#fff" stroke-width="1.2"><animateMotion dur="2.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear"><mpath href="#p"/></animateMotion></ellipse></svg>
<h1>Hockey <span>IQ</span> Hub</h1>
<p class="tag">Think the game. Play it smarter.</p>

</nav></main></body></html>
